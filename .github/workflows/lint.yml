name: Code quality

on:
  # PR updates run through pull_request; reserve push checks for main itself.
  push:
    branches: ["main"]
  pull_request:

# Replace outdated checks for the same PR or branch without cancelling other workflows.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - name: Check code and types
        run: npm run check

      - name: Check application Effect diagnostics
        run: npm run effect:diagnostics
      - name: Check component-test Effect diagnostics
        run: npm run effect:diagnostics:tests
