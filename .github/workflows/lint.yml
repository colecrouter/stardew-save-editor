name: Code quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - name: Check code and types
        run: npm run check

      - name: Check application Effect diagnostics
        run: npm run effect:diagnostics
      - name: Check component-test Effect diagnostics
        run: npm run effect:diagnostics:tests
