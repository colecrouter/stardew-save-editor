name: Run Tests

on:
  # PR updates run through pull_request; reserve push checks for main itself.
  push:
    branches: ["main"]
  pull_request:

# Replace outdated checks for the same PR or branch without cancelling other workflows.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Focused compiler cases verify committed codec fixtures without a game installation.
  # Real-binary inspection and regeneration coverage remain a documented TODO.
  game-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: npm ci
      - run: npm run check:game-data:fixtures
      - run: npm run test:game-data:compiler
      - run: dotnet format tools/game-data --verify-no-changes --no-restore

  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      # The default suite includes engine contracts and excludes opt-in legacy regressions.
      - run: npx playwright install --with-deps chromium
      - run: npm run test
      - name: Preserve component browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: component-browser-failures
          path: .vitest/attachments/
          if-no-files-found: ignore
          retention-days: 7
      # Committed codec fixtures make these runtime checks independent of .NET.
      - run: npm run test:game-data

  # Exercise native worker messaging and transfer semantics outside the DOM shim.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Verify save processing in a real browser
        shell: bash
        run: |
          # Own the process group so cleanup stops both Vite+ and its preview server.
          setsid ./node_modules/.bin/vp preview --host 127.0.0.1 --port 4269 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill -- "-$preview_pid" 2>/dev/null || true' EXIT
          curl --retry 30 --retry-delay 1 --retry-connrefused --retry-max-time 30 --max-time 2 --fail --silent --output /dev/null http://127.0.0.1:4269/stardew-save-editor/
          npm run test:browser:save-processing -- --output "$RUNNER_TEMP/save-processing.json"
      - name: Preserve browser regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: save-processing-browser
          path: |
            ${{ runner.temp }}/save-processing.json*
            ${{ runner.temp }}/preview.log
          if-no-files-found: ignore
          retention-days: 7
