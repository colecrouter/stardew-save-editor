name: Run Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The offline fixture exercises the .NET inspector/compiler and browser codecs.
  # No game installation or generated snapshots are needed in CI.
  game-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: npm ci
      - run: npm run test:game-data
      - run: dotnet format tools/game-data --verify-no-changes --no-restore

  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - run: npm run test

  # Standalone engine/native-Node checks survive retirement of the lab package.
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/engine/package-lock.json
      - run: npm ci
      - run: npm ci --prefix tests/engine
      - run: npm run check --prefix tests/engine
      - run: npm run effect:diagnostics --prefix tests/engine
      - run: npm test --prefix tests/engine
