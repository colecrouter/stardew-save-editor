name: Run Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The offline fixture exercises the .NET inspector/compiler and browser codecs.
  # No game installation or generated snapshots are needed in CI.
  game-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: npm ci
      - run: npm run test:game-data
      - run: dotnet format tools/game-data --verify-no-changes --no-restore

  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      # The default suite excludes opt-in legacy editor regressions.
      - run: npm run test

  # Standalone engine/native-Node checks survive retirement of the lab package.
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/engine/package-lock.json
      - run: npm ci
      - run: npm ci --prefix tests/engine
      - run: npm run check --prefix tests/engine
      - run: npm run effect:diagnostics --prefix tests/engine
      - run: npm test --prefix tests/engine

  # Exercise native worker messaging and transfer semantics outside the DOM shim.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Verify save processing in a real browser
        shell: bash
        run: |
          # Own the process group so cleanup stops both Vite+ and its preview server.
          setsid ./node_modules/.bin/vp preview --host 127.0.0.1 --port 4269 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill -- "-$preview_pid" 2>/dev/null || true' EXIT
          curl --retry 30 --retry-delay 1 --retry-connrefused --retry-max-time 30 --max-time 2 --fail --silent --output /dev/null http://127.0.0.1:4269/stardew-save-editor/
          npm run test:browser:save-processing -- --output "$RUNNER_TEMP/save-processing.json"
      - name: Preserve browser regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: save-processing-browser
          path: |
            ${{ runner.temp }}/save-processing.json*
            ${{ runner.temp }}/preview.log
          if-no-files-found: ignore
          retention-days: 7
