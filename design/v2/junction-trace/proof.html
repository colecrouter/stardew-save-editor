<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Reference-traced frame junction</title>
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				color: var(--foreground, #292018);
				font:
					14px system-ui,
					sans-serif;
			}
			.comparison {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(198px, 1fr));
				gap: 20px;
				margin-bottom: 18px;
			}
			figure {
				margin: 0;
			}
			figcaption {
				margin: 0 0 8px;
				color: var(--muted-foreground, #675b4b);
			}
			.crop {
				display: block;
				width: 198px;
				height: 192px;
				max-width: none;
				image-rendering: pixelated;
			}
			.controls {
				display: flex;
				align-items: center;
				flex-wrap: wrap;
				gap: 10px;
				margin: 14px 0;
			}
			input[type="range"] {
				width: 180px;
			}
			button {
				font: inherit;
				color: inherit;
				background: var(--secondary, #eee5d3);
				border: 1px solid var(--border, #a79681);
				padding: 7px 12px;
				border-radius: 5px;
				cursor: pointer;
			}
			button:focus-visible,
			input:focus-visible {
				outline: 3px solid #2785b4;
				outline-offset: 3px;
			}
			.scene {
				--post-x: 140px;
				position: relative;
				width: min(100%, var(--sample-width, 640px));
				height: 300px;
				isolation: isolate;
				overflow: hidden;
				background: #542913;
			}
			.header {
				position: absolute;
				inset: 0 0 auto;
				height: 44px;
				background: linear-gradient(#fad18b, #facd85);
			}
			.paper {
				position: absolute;
				left: calc(var(--post-x) + 42px);
				right: 0;
				top: 84px;
				bottom: 0;
				background: #fcdeaa url(../study-assets-v1/parchment.png) center/cover;
			}
			.rail {
				position: absolute;
				left: 0;
				right: 0;
				top: 35px;
				height: 63px;
				background: url(rail.svg) repeat-x;
				background-position: calc(var(--post-x) - 96px) 0;
			}
			.post {
				position: absolute;
				left: var(--post-x);
				width: 42px;
				top: 84px;
				bottom: 0;
				background: url(post.svg) repeat-y;
				background-position: 0 41px;
			}
			.paper-top {
				position: absolute;
				left: calc(var(--post-x) + 82px);
				right: 0;
				top: 84px;
				height: 41px;
				background: url(paper-top.svg) repeat-x;
			}
			.paper-side {
				position: absolute;
				left: calc(var(--post-x) + 42px);
				width: 40px;
				top: 125px;
				bottom: 0;
				background: url(paper-side.svg) repeat-y;
			}
			.junction {
				clip-path: polygon(
					0 35px,
					198px 35px,
					198px 125px,
					178px 125px,
					178px 192px,
					90px 192px,
					90px 98px,
					0 98px
				);
				position: absolute;
				left: calc(var(--post-x) - 96px);
				top: 0;
				width: 198px;
				height: 192px;
				background: url(junction.svg) no-repeat;
			}
			.note {
				font-size: 13px;
				line-height: 1.5;
				color: var(--muted-foreground, #675b4b);
				max-width: 660px;
				margin-bottom: 0;
			}
		</style>
	</head>
	<body>
		<div class="comparison">
			<figure>
				<figcaption>Your supplied junction</figcaption>
				<img
					class="crop"
					src="reference-junction.png"
					alt="Supplied crop showing the wood rail meeting the post and recessed parchment corner"
				/>
			</figure>
			<figure>
				<figcaption>SVG trace · same display size</figcaption>
				<img
					class="crop"
					src="junction.svg"
					alt="Integer-grid SVG trace preserving the reference junction and recess"
				/>
			</figure>
		</div>
		<div class="controls">
			<label for="width">Extend the surrounding frame</label
			><input
				id="width"
				type="range"
				min="300"
				max="680"
				step="1"
				value="640"
			/><output for="width" id="size">640px</output
			><button type="button" id="guides" aria-pressed="false">
				Show component seams
			</button>
		</div>
		<div
			class="scene"
			aria-label="Resizable frame junction with fixed-size artwork"
		>
			<div class="header"></div>
			<div class="paper"></div>
			<div class="rail"></div>
			<div class="post"></div>
			<div class="paper-top"></div>
			<div class="paper-side"></div>
			<div class="junction"></div>
		</div>
		<p class="note">
			This is a junction study at the supplied crop’s scale, not a full app
			redesign. The SVG trace groups the sampled colours into 48 shades. The
			rail, post and parchment lip extend separately; the junction and edge
			artwork keep their source dimensions.
		</p>
		<script>
			const scene = document.querySelector(".scene"),
				slider = document.querySelector("#width"),
				size = document.querySelector("#size"),
				guides = document.querySelector("#guides");
			slider.addEventListener("input", () => {
				scene.style.setProperty("--sample-width", `${slider.value}px`);
				size.value = `${slider.value}px`;
			});
			guides.addEventListener("click", () => {
				const active = guides.getAttribute("aria-pressed") !== "true";
				guides.setAttribute("aria-pressed", String(active));
				scene.querySelectorAll("div").forEach((part) => {
					part.style.outline = active ? "1px dashed #197795" : "";
					part.title = active ? part.className : "";
				});
			});
		</script>
	</body>
</html>
