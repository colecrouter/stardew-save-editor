<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="google-site-verification"
			content="0DOEtc-uS6QwL-wBkcKCYNMUwfoLslSEKbVkxbp_ZnE"
		/>
		<title>Stardew Valley Save Editor</title>
		<meta
			name="description"
			content="An online save editor for Stardew Valley. Upload your save, then change your appearance, inventory, skills, and more."
		/>

		<meta property="og:title" content="Stardew Valley Save Editor" />
		<meta
			property="og:description"
			content="An online save editor for Stardew Valley. Upload your save, then change your appearance, inventory, skills, and more."
		/>
		<meta
			property="og:url"
			content="https://colecrouter.github.io/stardew-save-editor/"
		/>
		<meta property="og:type" content="website" />

		<meta name="twitter:card" content="summary" />

		<meta
			name="keywords"
			content="stardew valley, save editor, online editor, game editor, pc, mac, linux, android, ios"
		/>
		<!-- Capture the browser intrinsic before compatibility modules run. The
		     editor clones validated plain data, while the global compatibility
		     implementation must remain available for Error and host-object fixes. -->
		<script data-editor-native-clone>
			(() => {
				const key = Symbol.for("stardew-save-editor.nativeStructuredClone");
				// Record absence too: a later bootstrap must not mistake the installed
				// compatibility implementation for the original browser intrinsic.
				if (!Object.prototype.hasOwnProperty.call(globalThis, key)) {
					const clone = globalThis.structuredClone;
					Object.defineProperty(globalThis, key, {
						value:
							typeof clone === "function" ? clone.bind(globalThis) : undefined,
						configurable: true,
					});
				}
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
